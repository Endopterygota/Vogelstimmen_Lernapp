name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: node scripts/check-media.mjs
      - run: pnpm android:sync
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: Vogelstimmen-Android-Testversion
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
